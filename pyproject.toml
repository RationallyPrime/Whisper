[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rt-whisper"
version = "0.2.0"
description = "Realtime speech-to-text with Faster-Whisper, focused on StreamDeck integration"
readme = "README.md"
requires-python = ">=3.9, <3.11"
license = { text = "MIT" }
authors = [
    { name = "rationallyprime" }
]
dependencies = [
    "faster-whisper>=0.10.0",
    "sounddevice>=0.5.0",
    "numpy>=1.20.0",
    "pynput>=1.7.0",
    "pyperclip>=1.8.0",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
    "anthropic>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rt_whisper"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py39", "py310"]

[tool.hatch.build.hooks.vcs]
version-file = "rt_whisper/_version.py" 
