[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rt-whisper"
version = "0.3.0"
description = "Realtime speech-to-text with Faster-Whisper, focused on StreamDeck integration"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "rationallyprime" }
]
dependencies = [
    "faster-whisper>=0.10.0,<1.1",
    "sounddevice>=0.5.0",
    "numpy>=1.20.0",
    "pyperclip>=1.8.0",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
    "anthropic>=0.8.0",
    "python-dotenv>=1.0.0",
    "openai>=1.92.2",
    "tiktoken>=0.9.0",
    "pydantic>=2.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.1",
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rt_whisper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
